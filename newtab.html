<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxLaunch</title>
  <link rel="icon" type="image/svg+xml" href="icons/foxlaunch-app-icon.svg" />
  <link rel="stylesheet" href="/src/styles/themes.css" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app" class="foxlaunch-app">
    <!-- Application Header -->
    <header class="app-header" role="banner">
      <div class="header-brand">
        <svg class="brand-logo" width="32" height="32" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="fxFlameGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFB800"/>
              <stop offset="45%" stop-color="#FF7139"/>
              <stop offset="100%" stop-color="#C6007A"/>
            </linearGradient>
          </defs>
          <path d="M70 34C78 44 78 61 68 72C56 84 35 83 24 70C14 57 17 37 31 26C43 17 58 20 65 29" stroke="url(#fxFlameGrad)" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M60 28L71 20L69 32" stroke="#FFB800" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="43" cy="46" r="3.5" fill="#FFFFFF"/>
          <circle cx="76" cy="26" r="3" fill="#FFD43B"/>
        </svg>
        <h1 class="brand-title">FoxLaunch</h1>
      </div>
      
      <!-- Search & Filter Bar -->
      <div class="header-search" role="search">
        <div class="search-input-wrapper">
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search shortcuts or containers... (/ to focus)"
            aria-label="Search shortcuts or containers"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="search-hotkey" aria-hidden="true">/</kbd>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="header-actions">
        <button
          type="button"
          id="settings-btn"
          class="btn-icon"
          aria-label="Open FoxLaunch Settings"
          title="Settings"
        >
          <svg class="icon-gear" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content: Dynamic Container Swimlanes -->
    <main id="main-content" class="app-main" role="main">
      <div id="swimlanes-container" class="swimlanes-container" aria-label="Container Swimlanes">
        <!-- Rendered by src/app.ts -->
      </div>
    </main>

    <!-- Dynamic Overlay Mount Roots -->
    <div id="modal-root" class="modal-root" aria-live="polite"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <div id="onboarding-root" class="onboarding-root" aria-live="polite"></div>

    <footer class="app-footer">
      FoxLaunch<span id="app-version"></span> • © FoxLaunch contributors
    </footer>
  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
