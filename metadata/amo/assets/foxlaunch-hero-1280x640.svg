<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2B2A33" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1C1B22" stop-opacity="1"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="1"/>
    </radialGradient>

    <!-- Acorn Flame Gradient -->
    <linearGradient id="heroFlameGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="45%" stop-color="#FF7139"/>
      <stop offset="100%" stop-color="#C6007A"/>
    </linearGradient>

    <!-- Violet Accent Glow -->
    <radialGradient id="violetOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8000FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8000FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1280" height="640" fill="url(#heroBgGlow)"/>

  <!-- Subtle Container Orbital Rings -->
  <g opacity="0.4">
    <ellipse cx="640" cy="270" rx="360" ry="190" stroke="#37ADFF" stroke-width="1.5" stroke-dasharray="8 20"/>
    <ellipse cx="640" cy="270" rx="310" ry="160" stroke="#00C79A" stroke-width="1.5" stroke-dasharray="6 24"/>
    <ellipse cx="640" cy="270" rx="260" ry="130" stroke="#FF922B" stroke-width="1.5" stroke-dasharray="10 18"/>
    <ellipse cx="640" cy="270" rx="210" ry="100" stroke="#CC5DE8" stroke-width="1.5" stroke-dasharray="4 28"/>
  </g>

  <!-- Ambient Glow Behind Mark -->
  <circle cx="640" cy="230" r="180" fill="url(#violetOrb)"/>

  <!-- Curled Ensō Flame Fox Mark (Centered) -->
  <g transform="translate(560, 150) scale(1.6)">
    <!-- Curled Ensō Continuous Curve -->
    <path d="M70 34C78 44 78 61 68 72C56 84 35 83 24 70C14 57 17 37 31 26C43 17 58 20 65 29" stroke="url(#heroFlameGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Fox Snout & Ear -->
    <path d="M60 28L71 20L69 32" stroke="#FFB800" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="43" cy="46" r="3.5" fill="#FFFFFF"/>
    <circle cx="76" cy="26" r="3" fill="#FFD43B"/>
  </g>

  <!-- Typography Lockup -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Brand Title -->
    <text x="640" y="380" font-size="44" font-weight="800" fill="#FBFBFE" letter-spacing="-0.03em">
      FoxLaunch <tspan fill="#FF7139" font-weight="700" font-size="34">CORE</tspan>
    </text>

    <!-- Tagline -->
    <text x="640" y="425" font-size="20" font-weight="500" fill="#A6A4B6" letter-spacing="-0.01em">
      The missing home for your Firefox Multi-Account Containers.
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(640, 470)">
      <!-- Badge 1: 1-Click Launch -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#2B2A33" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="-62" cy="0" r="5" fill="#FF7139"/>
        <text x="6" y="5" font-size="12" font-weight="600" fill="#FBFBFE" text-anchor="middle">1-Click Launch</text>
      </g>

      <!-- Badge 2: Isolated Swimlanes -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#2B2A33" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="-72" cy="0" r="5" fill="#00C79A"/>
        <text x="6" y="5" font-size="12" font-weight="600" fill="#FBFBFE" text-anchor="middle">Container Swimlanes</text>
      </g>

      <!-- Badge 3: 100% Offline -->
      <g transform="translate(240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#2B2A33" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="-62" cy="0" r="5" fill="#37ADFF"/>
        <text x="6" y="5" font-size="12" font-weight="600" fill="#FBFBFE" text-anchor="middle">100% Local Privacy</text>
      </g>
    </g>

    <!-- Micro-stamp -->
    <text x="640" y="570" font-size="12" font-weight="500" fill="#716F82" letter-spacing="0.08em">
      SUB-10MS COLD DISPATCH • ZERO TELEMETRY • NATIVE FIREFOX WORKSPACE
    </text>
  </g>
</svg>
